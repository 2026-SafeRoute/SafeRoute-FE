name: Auto Assign

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issues:
    types: [opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  assign-author:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue or PR to author
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.pull_request ?? context.payload.issue;
            const author = item.user.login;

            if (item.assignees?.some((assignee) => assignee.login === author)) return;

            try {
              await github.rest.issues.checkUserCanBeAssigned({
                ...context.repo,
                assignee: author,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.warning(`${author} cannot be assigned to #${item.number}`);
              return;
            }

            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: item.number,
              assignees: [author],
            });
